# Mamori HA gateway HAProxy template.
# Seed server lines use placeholders replaced by install-ha-haproxy.sh:
#   __SEED_ID__  e.g. mamorihub1
#   __SEED_IP__  e.g. 10.240.0.11
# manage-lb-node.sh clones these server lines when registering additional nodes.

global
        log /dev/log    local0
        log /dev/log    local1 notice
        chroot /var/lib/haproxy
        stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
        stats timeout 30s
        user haproxy
        group haproxy
        daemon
        ca-base /etc/ssl/certs
        crt-base /etc/ssl/private
        ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
        ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
        ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
        log     global
        mode    http
        option  httplog
        option  dontlognull
        timeout connect 5s
        timeout client  1h
        timeout server  1h
        errorfile 400 /etc/haproxy/errors/400.http
        errorfile 403 /etc/haproxy/errors/403.http
        errorfile 408 /etc/haproxy/errors/408.http
        errorfile 500 /etc/haproxy/errors/500.http
        errorfile 502 /etc/haproxy/errors/502.http
        errorfile 503 /etc/haproxy/errors/503.http
        errorfile 504 /etc/haproxy/errors/504.http

listen  stats
        bind            127.0.0.1:1936
        mode            http
        no log
        maxconn 10
        stats enable
        stats hide-version
        stats refresh 30s
        stats show-node
        stats uri  /haproxy?stats

listen  mamori-hub
        bind    *:1527
        mode    tcp
        option  tcplog
        option  logasap
        server  __SEED_ID__      __SEED_IP__:3527 no-check send-proxy-v2

listen  oracle-proxy
        bind    *:2521
        mode    tcp
        option  tcplog
        option  logasap
        server  __SEED_ID__      __SEED_IP__:3521 no-check send-proxy-v2

listen  legacy-oracle-proxy
        bind    *:1521
        mode    tcp
        option  tcplog
        option  logasap
        server  __SEED_ID__      __SEED_IP__:4521 no-check send-proxy-v2

listen  legacy-postgres-md5-proxy
        bind    *:5432
        mode    tcp
        option  tcplog
        option  logasap
        server  __SEED_ID__      __SEED_IP__:6432 no-check send-proxy-v2

listen  legacy-postgres-scram-proxy
        bind    *:5442
        mode    tcp
        option  tcplog
        option  logasap
        server  __SEED_ID__      __SEED_IP__:6442 no-check send-proxy-v2

listen  postgres-proxy
        bind    *:5433
        mode    tcp
        option  tcplog
        option  logasap
        server  __SEED_ID__      __SEED_IP__:6433 no-check send-proxy-v2

listen  legacy-mysql-proxy
        bind    *:3306
        mode    tcp
        option  tcplog
        option  logasap
        server  __SEED_ID__      __SEED_IP__:4306 no-check send-proxy-v2

listen  legacy-sqlserver-proxy
        bind    *:1433
        mode    tcp
        option  tcplog
        option  logasap
        server  __SEED_ID__      __SEED_IP__:2433 no-check send-proxy-v2

listen  sqlserver-proxy
