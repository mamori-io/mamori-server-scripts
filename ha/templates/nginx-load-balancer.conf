# Mamori HA gateway nginx site (sites-available/load-balancer).
# Placeholders replaced by install-host-nginx.sh --role gateway:
#   __SEED_NAME__   backend hostname (e.g. m1)
#   __SEED_IP__     unused in upstream (manage-lb-node uses hostname:80 + /etc/hosts)
#   __SERVER_NAME__ public server_name (default _)
#
# TLS paths match nginx-update-gateway-ssl.sh defaults (nginx.crt / nginx.key).
# Generate dhparam before first HTTPS enable if needed:
#   openssl dhparam 4096 -out /etc/nginx/ssl/dhparam.pem

upstream hub {
    ip_hash;
    server __SEED_NAME__:80;
}

server {
    server_name __SERVER_NAME__;

    listen 80 default_server;
    listen [::]:80 default_server;

    root /var/www/html;
    index some-file-that-does-not-exist;
    error_page 403 @gotohttps;
    error_page 404 @gotohttps;

    location / {
        try_files $uri $uri/ =404;
    }

    location @gotohttps {
        rewrite ^ https://$host$request_uri permanent;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_name __SERVER_NAME__;

    listen [::]:443 default_server ssl http2;
    listen      443 default_server ssl http2;

    client_max_body_size 100M;

    ssl_certificate     /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;

    # Optional: uncomment after generating dhparam.pem
    # ssl_dhparam /etc/nginx/ssl/dhparam.pem;

    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_prefer_server_ciphers on;
    ssl_ciphers EECDH+ECDSA+AESGCM:EECDH+aRSA+AESGCM:EECDH+ECDSA+SHA512:EECDH+ECDSA+SHA384:EECDH+ECDSA+SHA256:ECDH+AESGCM:ECDH+AES256:DH+AESGCM:DH+AES256:RSA+AESGCM:!aNULL:!eNULL:!LOW:!RC4:!3DES:!MD5:!EXP:!PSK:!SRP:!DSS;

    ssl_session_cache shared:TLS:2m;
    ssl_buffer_size 4k;

    add_header Strict-Transport-Security 'max-age=31536000; includeSubDomains; preload' always;

    location / {
        proxy_pass http://hub;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Force-HTTPS true;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Optional: proxy Grafana when monitoring is on a separate host.
    # Uncomment and set the monitoring host IP/hostname.
    # location /monitor/ {
    #     proxy_pass http://MONITORING_HOST:3000/monitor/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-Proto https;
    # }
}
